<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .calculator { background: #1e293b; padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; }
    #display { width: 100%; height: 60px; background: #0f172a; border: none; border-radius: 10px; color: #38bdf8; font-size: 28px; text-align: right; padding: 10px 15px; margin-bottom: 20px; outline: none; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    button { padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; background: #334155; color: #f8fafc; cursor: pointer; transition: 0.2s; }
    button:hover { background: #475569; }
    button.op { background: #0284c7; color: white; }
    button.op:hover { background: #0369a1; }
    button.clear { background: #ef4444; color: white; }
    button.clear:hover { background: #dc2626; }
    button.equal { background: #10b981; color: white; grid-column: span 2; }
    button.equal:hover { background: #059669; }
  </style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" readonly value="">
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="clear" onclick="deleteLast()">⌫</button>
    <button class="op" onclick="appendValue('/')">/</button>
    <button class="op" onclick="appendValue('*')">×</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="op" onclick="appendValue('-')">-</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="op" onclick="appendValue('+')">+</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="appendValue('.')">.</button>

    <button onclick="appendValue('0')">0</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');

  function appendValue(val) {
    if (display.value === 'Error') {
      display.value = '';
    }
    display.value += val;
  }

  function clearDisplay() {
    display.value = '';
  }

  function deleteLast() {
    if (display.value === 'Error') {
      display.value = '';
    } else {
      display.value = display.value.slice(0, -1);
    }
  }

  function calculate() {
    if (!display.value || display.value === 'Error') return;
    try {
      // Safe evaluation
      const result = Function('"use strict";return (' + display.value + ')')();
      display.value = Number.isFinite(result) ? result : 'Error';
    } catch (e) {
      display.value = 'Error';
    }
  }
</script>

</body>
</html>
