<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Neon Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #090d16;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .calculator {
      background: #111827;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(14, 165, 233, 0.15);
      width: 330px;
      border: 1px solid #1f2937;
    }

    #display {
      width: 100%;
      height: 75px;
      background: #030712;
      border: 2px solid #0284c7;
      border-radius: 14px;
      color: #38bdf8;
      font-size: 32px;
      font-weight: 600;
      text-align: right;
      padding: 10px 18px;
      margin-bottom: 22px;
      outline: none;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.2);
      letter-spacing: 1px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 16px;
      font-size: 19px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #1f2937;
      color: #f3f4f6;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }

    button:hover {
      background: #374151;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px);
    }

    button.op {
      background: #0284c7;
      color: #ffffff;
    }

    button.op:hover {
      background: #0369a1;
    }

    button.clear {
      background: #dc2626;
      color: #ffffff;
    }

    button.clear:hover {
      background: #b91c1c;
    }

    button.equal {
      background: #059669;
      color: #ffffff;
      grid-column: span 2;
    }

    button.equal:hover {
      background: #047857;
    }
  </style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" readonly placeholder="0">
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="clear" onclick="deleteLast()">⌫</button>
    <button class="op" onclick="appendOp('/')">/</button>
    <button class="op" onclick="appendOp('*')">×</button>

    <button onclick="appendNum('7')">7</button>
    <button onclick="appendNum('8')">8</button>
    <button onclick="appendNum('9')">9</button>
    <button class="op" onclick="appendOp('-')">-</button>

    <button onclick="appendNum('4')">4</button>
    <button onclick="appendNum('5')">5</button>
    <button onclick="appendNum('6')">6</button>
    <button class="op" onclick="appendOp('+')">+</button>

    <button onclick="appendNum('1')">1</button>
    <button onclick="appendNum('2')">2</button>
    <button onclick="appendNum('3')">3</button>
    <button onclick="appendDot('.')">.</button>

    <button onclick="appendNum('0')">0</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');

  function appendNum(num) {
    if (display.value === 'Error' || display.value === '0') {
      display.value = num;
    } else {
      display.value += num;
    }
  }

  function appendOp(op) {
    if (display.value === 'Error' || display.value === '') return;
    const lastChar = display.value.slice(-1);
    if (['+', '-', '*', '/'].includes(lastChar)) {
      display.value = display.value.slice(0, -1) + op;
    } else {
      display.value += op;
    }
  }

  function appendDot(dot) {
    if (display.value === 'Error' || display.value === '') {
      display.value = '0.';
      return;
    }
    const parts = display.value.split(/[\+\-\*\/]/);
    const currentPart = parts[parts.length - 1];
    if (!currentPart.includes('.')) {
      display.value += dot;
    }
  }

  function clearDisplay() {
    display.value = '';
  }

  function deleteLast() {
    if (display.value === 'Error') {
      display.value = '';
    } else {
      display.value = display.value.slice(0, -1);
    }
  }

  function calculate() {
    if (!display.value || display.value === 'Error') return;
    try {
      const sanitizedExpr = display.value.replace(/[^0-9+\-*/.]/g, '');
      const result = new Function(`'use strict'; return (${sanitizedExpr})`)();
      if (!isFinite(result) || isNaN(result)) {
        display.value = 'Error';
      } else {
        display.value = String(Math.round(result * 100000000) / 100000000);
      }
    } catch (err) {
      display.value = 'Error';
    }
  }
</script>

</body>
</html>
